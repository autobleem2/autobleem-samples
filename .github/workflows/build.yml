# autobleem-samples CI: the sample-games pack from tools/samples/samples.json with tools/build_samples.py -
# every game's files from its upstream release, each checked against the manifest's sha256 - on every push
# and PR (so a moved or changed upstream file is caught here, not by an installer), and on a v* tag or a
# dispatch with publish on, samples-<date>.tar.gz + .json go to the download site's samples/ (the
# self-hosted runner - the site is its disk). Gated by AB_CI_ENABLED.
name: build

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      publish:
        description: publish the pack to the download site
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the pack
        run: |
          set -euo pipefail
          python3 tools/build_samples.py --out build_samples --cache .samples-cache
          ls -l build_samples
          tar -tzf build_samples/samples-*.tar.gz | head -40
      - uses: actions/upload-artifact@v7
        with:
          name: samples
          path: build_samples/samples-*
          retention-days: 30

  publish:
    if: >-
      vars.AB_CI_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: [self-hosted, linux, x64]
    env:
      AB_REPO_DIR: /home/claude/autobleem-repo
    steps:
      - uses: actions/checkout@v7
        with:
          repository: autobleem2/autobleem-repo
          path: autobleem-repo-tools
      - uses: actions/download-artifact@v8
        with:
          name: samples
          path: build_samples
      - name: Publish samples/ to the site
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:$PWD" -w "$PWD" -v "$AB_REPO_DIR:$AB_REPO_DIR" -e REPO_DIR="$AB_REPO_DIR" \
            ghcr.io/autobleem2/autobleem-build:latest \
            bash autobleem-repo-tools/tools/repo_publish.sh --local samples build_samples/samples-*.tar.gz build_samples/samples-*.json
